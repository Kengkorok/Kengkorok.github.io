<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Korok sedang bekerja</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='8' fill='%23e04848'/><rect y='8' width='16' height='8' fill='%23fff'/><rect y='7' width='16' height='2' fill='%23222'/><rect x='6' y='6' width='4' height='4' fill='%23222'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="office.css">
  <style>
    .credit { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 9; width: max-content; max-width: calc(100vw - 720px); margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
    .credit a { color: var(--muted); }
    @media (max-width: 900px) { .credit { position: static; transform: none; display: block; width: auto; max-width: none; text-align: center; white-space: normal; padding: 0 16px 16px; } }
  </style>
</head>
<body>
  <div id="office"></div>
  <div class="topbar">
    <h1>POKEMON KOROK SEDANG BEKERJA</h1>
    <button id="music" type="button" aria-pressed="false">♪ Muzik</button>
    <input id="volume" type="range" min="0" max="0.6" step="0.05" value="0.15" aria-label="Volume muzik" title="Volume muzik">
    <button id="full" type="button">⛶ Skrin penuh</button>
  </div>
  <section class="panel" id="team-panel">
    <h2>Team <span id="team-summary"></span></h2>
    <ul id="team"></ul>
  </section>
  <section class="panel" id="feed-panel">
    <h2>Aktiviti</h2>
    <ul id="feed"></ul>
  </section>
  <p class="credit">Hari kerja olok-olok, dijana terus dalam browser. Klik Pokémon untuk dengar cry. Sprite dari <a href="https://github.com/PokeAPI/sprites">PokeAPI/sprites</a>, cry dari <a href="https://play.pokemonshowdown.com/audio/cries/">Showdown</a> · Pokémon © Nintendo / Game Freak, projek hobi.</p>
  <script src="office.js"></script>
  <script src="sim.js"></script>
  <script src="music.js"></script>
  <script>
    // Endless generated workday: no server events, no recording.
    const $ = (id) => document.getElementById(id);
    const office = PalletOffice.createOffice($('office'), { feed: $('feed'), team: { list: $('team'), summary: $('team-summary') } });
    PalletSim.start(office);
    $('full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  </script>
</body>
</html>
