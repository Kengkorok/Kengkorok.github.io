<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Mohd Safwan Bin Abd Rahman</title>
<style>
  :root {
    --bg: #0e1117;
    --card: #161b22;
    --border: #262d38;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f0b90b;
    --accent2: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(240,185,11,.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(88,166,255,.08), transparent 40%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }

  .avatar {
    width: 96px; height: 96px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #d97706);
    display: grid; place-items: center;
    font-size: 40px; font-weight: 700; color: #0e1117;
  }

  h1 { font-size: 24px; letter-spacing: -.5px; }
  .role { color: var(--accent); font-size: 14px; margin-top: 6px; font-weight: 500; }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }

  .section { text-align: left; }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--muted); margin-bottom: 10px;
  }

  .skill {
    display: inline-block;
    background: #1f2630;
    border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; color: var(--accent2);
  }

  .tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .tag {
    background: transparent; border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 999px; font-size: 12px; color: var(--muted);
  }
  .tag:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">MS</div>
    <h1>Mohd Safwan Bin Abd Rahman</h1>
    <p class="role">Pembantu Pegawai Masjid</p>

    <div class="divider"></div>

    <div class="section" style="text-align:center">
      <h2 style="text-align:center">Kemahiran</h2>
      <span class="skill">Pengurusan Pejabat Masjid</span>
    </div>

    <div class="divider"></div>

    <div class="section" style="text-align:center">
      <h2 style="text-align:center">Fakta Menarik</h2>
      <div class="tags">
        <span class="tag">☕ Suka kopi</span>
        <span class="tag">🎮 Gaming</span>
        <span class="tag">💡 Explore tech</span>
      </div>
    </div>
  </div>
</body>
</html>
