# Jekyll (GitHub Pages) untuk bahagian blog.
# Laman utama, pallet-office/ dan aset lain disalin terus tanpa diproses.

title: Mohd Safwan Abd Rahman
description: Tulisan Korok pasal masjid, kod dan homelab.
url: https://korokk.com
lang: ms
timezone: Asia/Kuala_Lumpur

permalink: /blog/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-sitemap
  - jekyll-feed

# RSS (Atom) di /feed.xml
feed:
  path: feed.xml
  posts_limit: 20
author:
  name: Mohd Safwan Abd Rahman
  uri: https://korokk.com/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  # Tak mahu dicari di Google: keluar dari sitemap dan dapat meta noindex
  - scope: { path: "_posts/2026-10-28-hello-world.md" }
    values: { sitemap: false, noindex: true }
  - scope: { path: "brand" }
    values: { sitemap: false }
  - scope: { path: "pallet-office" }
    values: { sitemap: false }

exclude:
  - README.md
  - workers/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Komen. Dua pilihan dipapar sebelah-menyebelah:
#   1. "Nama sahaja": Cloudflare Worker dalam workers/komen/. Kosongkan `api` untuk sorok.
#   2. "Guna GitHub": giscus, disimpan dalam GitHub Discussions repo ini.
komen:
  api: "https://komen.sa7one.workers.dev"
  turnstile_sitekey: ""   # pilihan; isi kalau spam banyak
  giscus:
    repo: Kengkorok/Kengkorok.github.io
    repo_id: R_kgDOUMGsHw
    category: Announcements
    category_id: DIC_kwDOUMGsH84DJyUT
