<!doctype html>
<html lang="ms">
<head>
{% include head.html %}
</head>
<body>
  <header class="nav nav--blog wrap">
    <div>
      <a class="nav__name" href="{{ '/' | relative_url }}"><img class="logo--terang" src="{{ '/brand/svg/korokk-mendatar-ink.svg' | relative_url }}" alt="korokk.com" width="132" height="40"><img class="logo--gelap" src="{{ '/brand/svg/korokk-mendatar-krim.svg' | relative_url }}" alt="korokk.com" width="132" height="40"></a>
      <p class="nav__tag mono muted">Siang Bilal, Malam Coding</p>
    </div>
    <nav class="nav__links mono" aria-label="Utama">
      <a href="{{ '/#lab' | relative_url }}">Lab</a>
      <a href="{{ '/#kerjaya' | relative_url }}">Kerjaya</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a>
      <button type="button" class="tema" role="switch" aria-checked="false" aria-label="Mod gelap" title="Tukar tema"><span class="tema__tombol"><svg class="tema__matahari" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><svg class="tema__bulan" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span></button>
    </nav>
    <a class="btn btn--ink nav__cta" href="{{ '/#hubungi' | relative_url }}">Jom sembang <span class="arw">↗</span></a>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="footer wrap mono">
    <span>© {{ site.time | date: "%Y" }} Mohd Safwan Abd Rahman</span>
    <span>Dibina dengan Jekyll, hos di GitHub Pages</span>
    <span>Kuala Lumpur, <time id="kl-time">--:--</time></span>
  </footer>

  <script src="{{ '/main.js?v=2' | relative_url }}" defer></script>
  <script src="{{ '/blog.js?v=5' | relative_url }}" defer blocking="render"></script>
</body>
</html>
